name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
      - name: Assign automatic version
        id: version
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "name=0.8.${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "ORG_GRADLE_PROJECT_keeprVersionName=0.8.${RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_keeprVersionCode=$((1000 + RUN_NUMBER))" >> "$GITHUB_ENV"
      - run: ./gradlew releaseInventory
      - run: python3 scripts/check-advisories.py
      - run: python3 scripts/generate-notices.py --check
      - run: bash scripts/check-secrets.sh
      - run: ./gradlew assembleRelease assembleDebugAndroidTest lintRelease testDebugUnitTest
      - run: python3 scripts/verify-release.py app/build/outputs/apk/release/app-release-unsigned.apk
      - run: python3 -m unittest discover -s tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keepr-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  device-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/device-tests.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: device-test-results
          path: app/build/reports/androidTests/

  publish:
    needs: [build, device-tests]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check commit and existing publication
        id: release
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$head" != "$COMMIT" ]; then
            echo 'A newer commit is on main; skipping this publication.'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          if jq -e --arg tag "v$VERSION" 'any(.[]; .tag_name == $tag and .draft == false)' "$RUNNER_TEMP/releases.json" > /dev/null; then
            echo 'This version is already published; leaving its assets unchanged.'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.release.outputs.skip != 'true'
        with:
          name: keepr-release-unsigned
          path: unsigned
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: steps.release.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        if: steps.release.outputs.skip != 'true'
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Sign release APK with compatible production key rotation
        if: steps.release.outputs.skip != 'true'
        env:
          LEGACY_KEYSTORE_BASE64: ${{ secrets.KEEPR_SIGNING_KEYSTORE }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.KEEPR_RELEASE_KEYSTORE }}
          KEEPR_RELEASE_PASSWORD: ${{ secrets.KEEPR_RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$LEGACY_KEYSTORE_BASE64" && test -n "$RELEASE_KEYSTORE_BASE64" && test -n "$KEEPR_RELEASE_PASSWORD"
          umask 077
          export KEEPR_LEGACY_KEYSTORE="$RUNNER_TEMP/legacy.keystore"
          export KEEPR_RELEASE_KEYSTORE="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$KEEPR_LEGACY_KEYSTORE" "$KEEPR_RELEASE_KEYSTORE"' EXIT
          printf '%s' "$LEGACY_KEYSTORE_BASE64" | base64 --decode > "$KEEPR_LEGACY_KEYSTORE"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEEPR_RELEASE_KEYSTORE"
          mkdir -p output
          bash scripts/sign-release.sh unsigned/app-release-unsigned.apk "output/Keepr-$VERSION.apk"
          cd output
          sha256sum "Keepr-$VERSION.apk" > "Keepr-$VERSION.apk.sha256"
      - name: Publish APK and checksum together
        if: steps.release.outputs.skip != 'true'
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$head" != "$COMMIT" ]; then
            echo 'A newer commit arrived during signing; skipping publication.'
            exit 0
          fi
          tag="v$VERSION"
          if ! gh release view "$tag" --json isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            gh release create "$tag" --target "$COMMIT" --title "Keepr $VERSION" --draft --generate-notes
          else
            jq -e '.isDraft == true' "$RUNNER_TEMP/release.json" > /dev/null
          fi
          gh release upload "$tag" "output/Keepr-$VERSION.apk" "output/Keepr-$VERSION.apk.sha256" --clobber
          gh release edit "$tag" --draft=false --latest
          echo "Published https://github.com/$GH_REPO/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
