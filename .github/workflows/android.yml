name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assign automatic version
        id: version
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "name=0.7.${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "ORG_GRADLE_PROJECT_keeprVersionName=0.7.${RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_keeprVersionCode=$((1000 + RUN_NUMBER))" >> "$GITHUB_ENV"
      - run: ./gradlew assembleDebug assembleDebugAndroidTest lintDebug testDebugUnitTest
      - run: python3 -m unittest discover -s tests
      - uses: actions/upload-artifact@v4
        with:
          name: keepr-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      COMMIT: ${{ github.sha }}
    steps:
      - name: Check commit and existing publication
        id: release
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$head" != "$COMMIT" ]; then
            echo 'A newer commit is on main; skipping this publication.'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          if jq -e --arg tag "v$VERSION" 'any(.[]; .tag_name == $tag and .draft == false)' "$RUNNER_TEMP/releases.json" > /dev/null; then
            echo 'This version is already published; leaving its assets unchanged.'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.release.outputs.skip != 'true'
        with:
          name: keepr-debug
          path: unsigned
      - uses: actions/setup-java@v4
        if: steps.release.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.release.outputs.skip != 'true'
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Sign APK with the existing app identity
        if: steps.release.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEEPR_SIGNING_KEYSTORE }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'Missing KEEPR_SIGNING_KEYSTORE repository secret'; exit 1; }
          umask 077
          key="$RUNNER_TEMP/keepr-signing.keystore"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key"
          mkdir -p release
          apk="release/Keepr-$VERSION.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$key" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$apk" unsigned/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certificate.txt"
          grep -Fq 'Signer #1 certificate SHA-256 digest: a6245d028989b6f1ae99d685a424e2c8431e360aedaa04e4b48be597409bcd1f' "$RUNNER_TEMP/certificate.txt"
          cd release
          sha256sum "Keepr-$VERSION.apk" > "Keepr-$VERSION.apk.sha256"
      - name: Publish APK and checksum together
        if: steps.release.outputs.skip != 'true'
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$head" != "$COMMIT" ]; then
            echo 'A newer commit arrived during signing; skipping publication.'
            exit 0
          fi
          tag="v$VERSION"
          if ! gh release view "$tag" --json isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            gh release create "$tag" --target "$COMMIT" --title "Keepr $VERSION" --draft --generate-notes
          else
            jq -e '.isDraft == true' "$RUNNER_TEMP/release.json" > /dev/null
          fi
          gh release upload "$tag" "release/Keepr-$VERSION.apk" "release/Keepr-$VERSION.apk.sha256" --clobber
          gh release edit "$tag" --draft=false --latest
          echo "Published https://github.com/$GH_REPO/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
